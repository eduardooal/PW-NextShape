<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Style.index.css">
    <link rel="stylesheet" href="Style.login.css">
    <link href="Style.index.css">
    <script src="Script.login.js" defer></script>
    <title>NextShape</title>
</head>

<body>
    <header>
        <div class="header-logo">
            <a href="Index.html">
                <h1>NextShape</h1>
            </a>
        </div>
        <div class="header-icons">
            <a href="#"><img class="icon" src="assets/icons/search.svg" alt="Pesquisar"></a>
            <a href="#"><img class="icon" src="assets/icons/user.svg" alt="Login"></a>
            <a href="#"><img class="icon" src="assets/icons/admin.svg" alt="Admin"></a>
        </div>
    </header>
    <main class="area-login">
        <h2 class="titulo-acesso">ÁREA DE ACESSO</h2>
        <form class="forms-login">
            <input type="email" id="email" class="input-login" placeholder="E-mail">
            <input type="password" id="senha" class="input-login" placeholder="Senha">
            <p id="mensagem-alerta" class="mensagem-oculta"></p>
            <button type="button" class="botao fazer-login">Fazer Login</button>
            <a href="Cadastro.html" class="botao-criar-conta">Criar Conta</a>
        </form>
    </main>

    <!-- Rodapé realizado por Eduardo Alcantara -->
    <footer class="footer">
        <div class="footer-container">

            <div class="footer-logo">
                <h2>NextShape</h2>
                <p>Suplementos para elevar sua performance</p>
            </div>

            <div class="footer-links">
                <h3>Links</h3>
                <a href="Index.html#topo">Início</a>
                <a href="Index.html#produtos">Produtos</a>
            </div>

            <div class="footer-info">
                <h3>Institucional</h3>
                <a href="#">Sobre nós</a>
                <a href="#">Política de Privacidade</a>
                <a href="#">Termos de Uso</a>
            </div>

            <div class="footer-contact">
                <h3>Contato</h3>
                <p>Email: nextshape@gmail.com</p>
                <p>Telefone: (11) 99999-9999</p>
            </div>

        </div>

        <div class="footer-bottom">
            <p>© 2026 NextShape - Todos os direitos reservados</p>
        </div>
    </footer>
</body>

</html>
